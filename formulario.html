    <h2>Formulario de registro</h2>
    <form>
    <fieldset>
        <legend>Datos Personales</legend>
        Nombre: <input type="text" required> 
        Apellidos: <input type="text" required name="apellidos">
        Edad: <select name="edad">
            <option value="Jubilado">Mayor de 65</option>
            <option value="Adulto" selected>Mayor de 18</option>
            <option value="Menor">Menor de 18</option>
        </select>
        </fieldset>
    <fieldset>
        <legend>Datos de Identificación</legend>
        DNI: <input type="text" required name="DNI">
        Email: <input type="email" required name="email">
        Número: <input type="tel" required name="Telefono">

    </fieldset>
    <button type="submit" formaction="index.html" formnovalidate>Cancelar</button>
    <button type="submit" formaction="index.html">Registrarte</button>
    </form>
